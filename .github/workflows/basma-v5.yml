name: Basma v5.2 shared-site release
on:
  push:
    branches: [basma-v5-pages]
  workflow_dispatch:
permissions:
  contents: read
  deployments: read
concurrency:
  group: basma-pages
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify published source
        run: node validation/scripts/prepare-pages.js --verify .
      - name: Install test dependencies
        working-directory: validation
        run: npm ci
      - name: Install backend dependencies
        working-directory: validation
        run: npm --prefix functions ci
      - name: Load installed backend SDKs on Node 22
        working-directory: validation
        env:
          GCLOUD_PROJECT: demo-basma
          FIREBASE_CONFIG: '{"projectId":"demo-basma","databaseURL":"https://demo-basma-default-rtdb.firebaseio.com"}'
        run: node -e "require('./functions/index.js'); const req=require('node:module').createRequire(require('node:path').resolve('functions/package.json')); const {getApps,deleteApp}=req('firebase-admin/app'); Promise.all(getApps().map(deleteApp)).catch(error=>{console.error(error.message);process.exitCode=1;});"
      - name: Syntax and CSP checks
        working-directory: validation
        run: npm run check
      - name: Application tests
        working-directory: validation
        run: npm test
      - name: Mandatory Firebase rules and real pagination on the Database Emulator
        working-directory: validation
        run: |
          set -o pipefail
          npm run test:rules 2>&1 | tee rules-emulator-result.txt
      - name: Save emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rules-emulator-logs
          path: |
            validation/rules-emulator-result.txt
            validation/*debug.log
          if-no-files-found: ignore
      # The Pages bundle is uploaded HERE, minutes before the deploy job, so GitHub already lists it when deploy-pages
      # looks for it. Uploading it seconds before deploy-pages failed 3 times: "Found 2 artifact(s)" (24 Nov 2026).
      # It is only published by the deploy job, which still needs BOTH gates (verify + e2e) and the manual approval.
      - name: Upload the Pages bundle (published only after both gates and approval)
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          retention-days: 7
  # Browser E2E (Playwright + Chromium) on LOCAL Firebase emulators: real pages from site/, real server code, real
  # rules, App Check enforced with a local test token. No production accounts, data or secrets. Blocks the deploy.
  e2e:
    runs-on: ubuntu-24.04  # Playwright 1.52 has no Chromium build for ubuntu-latest (26.04)
    timeout-minutes: 25
    defaults:
      run:
        working-directory: validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm --prefix functions ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.52.0-${{ runner.os }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Local HTTPS for the test site (fingerprints need https, as in production)
        run: |
          set -e
          D="$RUNNER_TEMP/e2e-tls"; mkdir -p "$D"; cd "$D"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=Basma E2E local test CA" -keyout ca.key -out ca.pem -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout server.key -out server.csr 2>/dev/null
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n" > ext.cnf
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -out server.pem -extfile ext.cnf 2>/dev/null
          sudo apt-get install -y -qq libnss3-tools >/dev/null
          mkdir -p "$HOME/.pki/nssdb"; certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password 2>/dev/null || true
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n basma-e2e-local-ca -i ca.pem
          echo "E2E_TLS_CERT=$D/server.pem" >> "$GITHUB_ENV"; echo "E2E_TLS_KEY=$D/server.key" >> "$GITHUB_ENV"
      - name: E2E — full flow on the release candidate (site/)
        env:
          E2E_OUT: e2e-results
        run: npm run e2e
      - name: E2E — proof run on the previous release (baseline-site/, information only)
        if: always()
        continue-on-error: true
        env:
          E2E_OUT: e2e-baseline
          E2E_SITE: ../baseline-site
        run: node tests/e2e-prepare.js && npx firebase emulators:exec --only auth,database,functions --project demo-basma 'node tests/e2e-run.js --grep "opens cleanly|branch map"'
      - name: Timing report
        if: always()
        run: cat e2e-results/timings-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no timing report" >> "$GITHUB_STEP_SUMMARY"
      - name: Save screenshots, timings and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            validation/e2e-results
            validation/e2e-baseline
          if-no-files-found: ignore
          retention-days: 14
  deploy:
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      deployments: read
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Display scoped diff and verify current live site before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: node validation/scripts/prepare-pages.js --preflight .
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  # After publishing: read-only checks of the LIVE site (no login, nothing written). A failure shows as a red run.
  live-check:
    needs: deploy
    runs-on: ubuntu-24.04  # Playwright 1.52 has no Chromium build for ubuntu-latest (26.04)
    timeout-minutes: 15
    defaults:
      run:
        working-directory: validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.52.0-${{ runner.os }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Live read-only checks
        env:
          E2E_OUT: e2e-live
        run: npm run e2e:live
      - name: Timing report
        if: always()
        run: cat e2e-live/timings-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Save live results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-live
          path: validation/e2e-live
          if-no-files-found: ignore
          retention-days: 14
